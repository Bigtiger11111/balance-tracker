<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - My Balance Tracker</title>
    <link rel="stylesheet" href="style.css">
    <!-- Highcharts 3D Scripts -->
    <script src="https://code.highcharts.com/highcharts.js"></script>
    <script src="https://code.highcharts.com/highcharts-3d.js"></script>
</head>
<body>
    <div class="header">
        <div>
            <h2>Dashboard</h2>
            <h3>My Balance Tracker</h3>
        </div>
        
        <div class="dropdown">
            <button class="menu-btn">Menu ▼</button>
            <div class="dropdown-content">
                <a href="transaction.html">Transaction</a>
                <a href="history.html">History</a>
                <a href="#" onclick="logout()">Logout</a>
            </div>
        </div>
    </div>

    <div class="main-layout">
        <!-- 3D Pie Chart Container -->
        <div class="chart-container">
            <div id="balanceChart" style="width: 100%; height: 260px;"></div>
        </div>

        <!-- Account Balances -->
        <div class="balance-container">
            <table class="bal-table">
                <tr><td>Esewa</td><td>: Rs. <span id="esewa-bal">3.09</span></td></tr>
                <tr><td>Nic Asia</td><td>: Rs. <span id="nicasia-bal">0.52</span></td></tr>
                <tr><td>CTZ</td><td>: Rs. <span id="ctz-bal">171.81</span></td></tr>
                <tr><td>Cash</td><td>: Rs. <span id="cash-bal">13230.00</span></td></tr>
            </table>

            <div class="total-box">
                <div>Total Amount</div>
                <div class="total-val">Rs. <span id="total-bal">0</span></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        loadDashboard();
    </script>
</body>
</html>
